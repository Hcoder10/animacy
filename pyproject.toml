[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animacy"
version = "0.1.0"
description = "The open interaction layer for expressive robots: human motion in, any robot's motion out — one ROBOT.md per body."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "pydantic>=2",
  "scipy>=1.11",
  # a clip is motion.parquet + audio.wav, and HumanClip.save/load in schema.py
  # reads and writes that wav, so this is core rather than a capture extra.
  "soundfile>=0.12",
]

[project.optional-dependencies]
capture = ["mediapipe>=0.10", "opencv-python>=4.9", "sounddevice>=0.4"]
# yourdfpy/trimesh: `animacy check`'s URDF limit test. matplotlib: `animacy preview`
# renders the calibration poses through Agg, so it works headless and in CI.
urdf = ["yourdfpy>=0.0.56", "trimesh>=4", "matplotlib>=3.7"]
# talking to a real robot: `animacy say --url`, `animacy mirror --sink`
robot = ["requests>=2.31"]
train = ["torch>=2.2", "onnx", "onnxruntime"]
dev = ["pytest>=8"]

[project.scripts]
animacy = "animacy.cli:main"

[tool.setuptools.packages.find]
include = ["animacy*"]

[tool.pytest.ini_options]
# animacy's own suite only. `third_party/autonomous-os/` is a scratch clone of the
# vendor repo (gitignored, cloned for evidence runs); collecting it errors out on
# its own missing deps and has nothing to do with this project.
testpaths = ["tests"]
norecursedirs = ["third_party", "data", "checkpoints", "web", ".venv*", "build", "dist"]
