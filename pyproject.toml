[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animacy"
version = "0.1.0"
description = "The open interaction layer for expressive robots: human motion in, any robot's motion out — one ROBOT.md per body."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "pydantic>=2",
  "scipy>=1.11",
]

[project.optional-dependencies]
capture = ["mediapipe>=0.10", "opencv-python>=4.9", "soundfile>=0.12", "sounddevice>=0.4"]
urdf = ["yourdfpy>=0.0.56", "trimesh>=4"]
train = ["torch>=2.2", "onnx", "onnxruntime"]
dev = ["pytest>=8"]

[project.scripts]
animacy = "animacy.cli:main"

[tool.setuptools.packages.find]
include = ["animacy*"]
