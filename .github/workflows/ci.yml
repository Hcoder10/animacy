name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - name: every robot profile validates
        run: |
          set -e
          for r in robots/*/; do
            case "$r" in robots/_*) continue;; esac
            [ -f "$r/ROBOT.md" ] || continue
            python -m animacy.cli check "$r"
          done
      - run: python -m pytest tests/test_core.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS retargeter == Python retargeter (1e-6)
        run: python -m pytest tests/test_web_retarget_parity.py -q
