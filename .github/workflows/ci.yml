name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: the contract (`ROBOT.md` + URDF for every robot), the pure-Python
  # core, and the JS-equals-Python parity test. No heavy optional dependencies —
  # everything that needs one is guarded by `pytest.importorskip` and skips here.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: every robot profile validates
        run: |
          set -e
          for r in robots/*/; do
            case "$r" in robots/_*) continue;; esac
            [ -f "$r/ROBOT.md" ] || continue
            python -m animacy.cli check "$r"
          done

      - name: core suite (optional-dependency tests skip)
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS retargeter == Python retargeter (1e-6)
        run: python -m pytest tests/test_web_retarget_parity.py -q

  # Slow lane: the paths that need optional dependencies — URDF forward
  # kinematics (yourdfpy), the headless `animacy preview` renders (matplotlib
  # Agg), and the VQ + audio->motion model with its ONNX export (torch,
  # onnxruntime). CPU wheels only.
  optional-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[urdf,train,dev]"

      - name: URDF forward kinematics (lamp, reachy_mini, so101)
        run: python -m pytest tests/test_lamp_urdf.py tests/test_reachy_urdf.py tests/test_so101.py -q

      - name: retarget maths and the fitted mappings
        run: python -m pytest tests/test_retarget_features.py tests/test_retarget_fit.py -q

      - name: animacy preview renders the calibration poses headlessly
        run: python -m pytest tests/test_preview.py -q

      - name: VQ + audio->motion model, and the ONNX export the page loads
        run: python -m pytest tests/test_model_synthetic.py -q

      - name: full suite
        run: python -m pytest -q
